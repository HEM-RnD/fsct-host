[package]
name = "fsct-platform-macos"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
description = "macOS platform service and OS bindings for FSCT."

[dependencies]
fsct_core.workspace = true
anyhow.workspace = true
env_logger.workspace = true
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
media-remote = { git = "https://github.com/HEM-RnD/media-remote.git", branch = "feature/add_playback_Rate" }
tokio = { workspace = true, features = ["full"] }

[[bin]]
name = "fsct_driver_service"
path = "src/bin/service_main.rs"
