name: Node Client Build

on:
  workflow_call:
    inputs:
      cargo_version:
        description: 'Version string passed to cargo set-version (for the ipc_test_server binary).'
        type: string
        required: true

concurrency:
  group: node-client-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build @hemspzoo/fsct-client
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: clients/node/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Inject computed version
        shell: bash
        run: bash script/inject_version.sh "${{ inputs.cargo_version }}"

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-node-client-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-node-client-
            ${{ runner.os }}-cargo-

      - name: Build ipc_test_server (for integration tests)
        run: cargo build --bin ipc_test_server --features test-utils

      - name: Install npm dependencies
        working-directory: clients/node
        run: npm ci

      - name: Typecheck
        working-directory: clients/node
        run: npm run typecheck

      - name: Build package
        working-directory: clients/node
        run: npm run build

      - name: Run unit tests
        working-directory: clients/node
        run: npm run test:unit

      - name: Run integration tests
        working-directory: clients/node
        run: npm run test:integration

      - name: Pack npm tarball
        working-directory: clients/node
        run: npm pack

      # Tarball is the same on all 3 OSes (pure JS in dist/); upload it once from Linux only.
      - name: Upload npm package artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: fsct-client-node
          path: clients/node/hemspzoo-fsct-client-*.tgz
          retention-days: 30
