name: Build and Push Cross Images

on:
  push:
    branches: [ develop, main, 'release/**', 'hotfix/**', 'FSCT-51-Add-linux-server-build' ]
    paths:
      - '.cross/**'
      - 'Cross.toml'
      - '.github/workflows/build-cross-images.yml'
  pull_request:
    branches: [ develop, main, 'release/**', 'hotfix/**' ]
    paths:
      - '.cross/**'
      - 'Cross.toml'
      - '.github/workflows/build-cross-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-cross-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  IMAGE_PREFIX: fsct-cross
  BASE_TAG: base-buster

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          REPO="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_PREFIX }}"
          DATE=$(date +'%Y.%m.%d')
          SHORT_SHA=${GITHUB_SHA::7}
          echo "repo=${REPO}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build+push base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .cross/Dockerfile.base
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}:${{ env.BASE_TAG }}
            ${{ steps.meta.outputs.repo }}:${{ env.BASE_TAG }}-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha }}

      - name: Build+push x86_64-unknown-linux-gnu
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .cross/Dockerfile.x86_64-unknown-linux-gnu
          platforms: linux/amd64
          build-args: |
            OWNER=${{ env.IMAGE_OWNER }}
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}:x86_64-unknown-linux-gnu-buster
            ${{ steps.meta.outputs.repo }}:x86_64-unknown-linux-gnu-buster-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha }}

      - name: Build+push i686-unknown-linux-gnu
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .cross/Dockerfile.i686-unknown-linux-gnu
          platforms: linux/amd64
          build-args: |
            OWNER=${{ env.IMAGE_OWNER }}
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}:i686-unknown-linux-gnu-buster
            ${{ steps.meta.outputs.repo }}:i686-unknown-linux-gnu-buster-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha }}

      - name: Build+push aarch64-unknown-linux-gnu
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .cross/Dockerfile.aarch64-unknown-linux-gnu
          platforms: linux/amd64
          build-args: |
            OWNER=${{ env.IMAGE_OWNER }}
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}:aarch64-unknown-linux-gnu-buster
            ${{ steps.meta.outputs.repo }}:aarch64-unknown-linux-gnu-buster-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha }}

      - name: Build+push armv7-unknown-linux-gnueabihf
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .cross/Dockerfile.armv7-unknown-linux-gnueabihf
          platforms: linux/amd64
          build-args: |
            OWNER=${{ env.IMAGE_OWNER }}
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}:armv7-unknown-linux-gnueabihf-buster
            ${{ steps.meta.outputs.repo }}:armv7-unknown-linux-gnueabihf-buster-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha }}

      - name: Build+push arm-unknown-linux-gnueabihf
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .cross/Dockerfile.arm-unknown-linux-gnueabihf
          platforms: linux/amd64
          build-args: |
            OWNER=${{ env.IMAGE_OWNER }}
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}:arm-unknown-linux-gnueabihf-buster
            ${{ steps.meta.outputs.repo }}:arm-unknown-linux-gnueabihf-buster-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha }}
