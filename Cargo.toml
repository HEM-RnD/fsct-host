[workspace]
resolver = "3"
members = ["clients/rust", "core", "driver", "bindings/node", "ipc"]

[workspace.package]
version = "0.2.13"
authors = ["Paweł Gorgoń", "HEM Sp. z o.o."]
description = "Host implementation of Ferrum Streaming Control Technology™ (FSCT). Additional licensing terms apply as described in LICENSE-FSCT.md."
license = "Apache-2.0"
edition = "2024"
repository = "https://github.com/HEM-RnD/fsct-host.git"
readme = "README.md"
publish = false

[workspace.dependencies]
async-trait = "0.1.88"
tokio = { version = "1.44", features = ["full"] }
futures = "0.3"
env_logger = "0.11"
fsct-core = { path = "core" }
fsct-client = { path = "clients/rust" }
fsct-driver = { path = "driver" }
fsct-ipc = { path = "ipc" }
log = "0.4.25"
thiserror = "2.0.12"
anyhow = "1.0.98"
uuid = { version = "1.17.0", features = ["v4", "v5", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = { version = "0.7", features = ["codec"] }

[profile.release]
lto = true
strip = "symbols"
panic = "abort"
